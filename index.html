<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Vehicles</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="container bg-gray-100 p-16  " >
    <div class="max-w-full rounded overflow-hidden shadow-lg mx-auto bg-white">
        <div class="px-6 py-4">
            <div class="mx-auto max-w-2xl text-center">
                <h2 class="text-4xl font-semibold tracking-tight text-balance text-gray-900 sm:text-5xl">Vehicles</h2>
                <p class="mt-2 text-lg/8 text-gray-600">Gestor de Vehicles per una empresa de lloger</p>
            </div>
        </div>
        <div class="px-6 pt-4 pb-2">
            <!-- component -->
            <div class="bg-gray-100">
                <div class="my-3  p-4 ">
                    <button id="carregarVehicles" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" onclick="cargarDatos()" >Carregar Vehicles</button>
                </div>
                <div class="flex flex-col mx-3 mt-6 lg:flex-row">
                    <div class="w-full lg:w-1/3 m-1 mb-5">
                        <form class="w-full bg-white shadow-md p-6 rounded-lg">
                            <div class="flex flex-wrap -mx-3 mb-6">
                                <div class="w-full md:w-full px-3 mb-6">
                                    <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2" htmlFor="category_name">Afegir un Vehicle</label>
                                </div>
                                
                                <div class="w-full px-3 mb-6 flex flex-wrap -mx-3">
                                    <label for="tipusVehicle">Tipus del vehicle</label>
                                    <select class="appearance-none block w-full bg-white text-gray-900 font-medium border border-gray-400 rounded-lg py-3 px-3 leading-tight focus:outline-none focus:border-[#98c01d]" id="tipusVehicle" onchange="cambiarTipo()">
                                        <option value="Cotxe">Cotxe</option>
                                        <option value="Moto">Moto</option>
                                        <option value="Camió">Camió</option>
                                    </select>
                                </div>                        
                                
                                <div class="w-full px-3 mb-6 flex flex-wrap -mx-3">
                                    <label for="marca">Marca del vehicle </label>
                                    <input  class="appearance-none block w-full bg-white text-gray-900 font-medium border border-gray-400 rounded-lg py-3 px-3 leading-tight focus:outline-none focus:border-[#98c01d]"  type="text" id="marca" placeholder="Marca">
                                </div>

                                <div class="w-full px-3 mb-6 flex flex-wrap -mx-3">
                                    <label for="marca">Model del vehicle </label>
                                    <input  class="appearance-none block w-full bg-white text-gray-900 font-medium border border-gray-400 rounded-lg py-3 px-3 leading-tight focus:outline-none focus:border-[#98c01d]"  type="text" id="model" placeholder="Model">
                                </div>

                                <div class="w-full px-3 mb-6 flex flex-wrap -mx-3">
                                    <label for="any">Any del vehicle</label>
                                    <input class="appearance-none block w-full bg-white text-gray-900 font-medium border border-gray-400 rounded-lg py-3 px-3 leading-tight focus:outline-none focus:border-[#98c01d]" type="number" id="any" placeholder="Any">
                                </div>

                                <div class="w-full px-3 mb-6 flex flex-wrap -mx-3">
                                    <label id="text-extra" for="any">Portes</label>
                                    <input class="appearance-none block w-full bg-white text-gray-900 font-medium border border-gray-400 rounded-lg py-3 px-3 leading-tight focus:outline-none focus:border-[#98c01d]" type="text" id="extra" placeholder="Portes">
                                </div>


                                
    
                                <div class="w-full md:w-full px-3 mb-6">
                                    <div onclick="AñadirVehiculo()" class="appearance-none block w-full bg-green-700 text-gray-100 font-bold border border-gray-200 rounded-lg py-3 px-3 leading-tight hover:bg-green-600 focus:outline-none focus:bg-white focus:border-gray-500"
                                    >Afegir vehicle</div>
                                </div>
                                
                            </div>
                        </form>
                    </div>
                    <div id="llistaVehicles" class="overflow-x-auto rounded-lg w-full px-3">
                        <div class="w-full mx-auto bg-white rounded-xl shadow-md overflow-hidden ">
                            <div class="p-8 flex w-full">
                                <div class="pr-4">
                                <p class="text-4xl font-bold">Carrega les dades</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                </div>
                
            </div>

        </div>
      </div>


    <script src="scripts.js"></script>
</body>
</html>
